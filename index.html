<!doctype html>
<html lang="mn">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Amarjargal 💘</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Dancing+Script:wght@700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* PRESERVING ALL YOUR ORIGINAL STYLES */
    :root{
      --bg1:#ff9a9e; --bg2:#fad0c4; --card:#ffffffdd; --text:#222;
      --muted:#555; --accent:#ff4d6d; --accent2:#7c3aed;
      --shadow: 0 18px 45px rgba(0,0,0,.18); --radius:26px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:'Noto Sans', sans-serif; color:var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height:100vh; overflow-x:hidden;
    }

    /* NEW: Professional Typography */
    h1, h2 { font-family: 'Montserrat', sans-serif; }
    .romantic-note { font-family: 'Dancing Script', cursive; color: var(--accent); font-size: 1.3rem; }

    .progress{ position:fixed; left:0; top:0; height:4px; width:0%; background: var(--accent); z-index:999; }
    .wrap{max-width:1040px; margin:0 auto; padding:26px 18px 90px;}
    
    /* YOUR ORIGINAL HERO & SECTIONS */
    .hero{ background:var(--card); backdrop-filter: blur(10px); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); }
    .avatar{ width:92px; height:92px; border-radius:999px; border:3px solid #fff; object-fit:cover; }
    .section{ margin-top:18px; background:var(--card); border-radius:var(--radius); padding:18px; box-shadow: 0 14px 34px rgba(0,0,0,.12); }

    .pill{ border:none; padding:11px 14px; border-radius:999px; background:var(--accent); color:#fff; font-weight:800; cursor:pointer; transition:.2s; }
    .pill:hover{transform: translateY(-1px) scale(1.02)}
    
    /* THE JUMPING BUTTON LOGIC */
    #no-btn-chapter { position: relative; transition: none; }

    /* ALL OTHER ORIGINAL CSS CLASSES (Timeline, Travel, Slideshow) REMAIN UNTOUCHED */
    .event{ display:flex; gap:14px; padding:14px; border-radius:22px; background:#fff; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
    .event img{ width:150px; height:100px; object-fit:cover; border-radius:18px; }
    .travelGrid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:12px; }
    .travelCard{ background:#fff; border-radius:22px; padding:12px; text-align:center; }
    .travelCard img{ width:100%; height:160px; object-fit:cover; border-radius:18px; }
    .reveal{opacity:0; transform: translateY(18px); transition: 0.6s ease; }
    .reveal.show{opacity:1; transform: translateY(0);}
  </style>
</head>

<body>
  <div class="progress" id="progress"></div>

  <div class="wrap">
    <div class="hero">
      <h1>Зөвхөн Амараад зориулав 💘</h1>
      <p>Энэ website-ыг <b>зөвхөн чамд</b>........ ✨</p>
      <div style="display:flex; justify-content:center; gap:15px; margin:20px 0;">
        <img class="avatar" src="me.jpg">
        <div style="font-size:30px; align-self:center;">💞</div>
        <img class="avatar" src="amar.jpg">
      </div>
      <button class="pill" onclick="document.getElementById('timelineSection').scrollIntoView({behavior:'smooth'})">Цаг хугацаагаар аялцгаая ✨</button>
    </div>

    <div class="section">
      <h2>🎵 Зөвхөн чамд зориулсан дуу</h2>
      <button class="pill" onclick="toggleMusic()" id="playBtn">Play ▶</button>
      <audio id="bgm" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <div class="section" id="timelineSection">
      <h2>📖 Эргэн дурсацгаая</h2>
      <div id="timeline-container"></div>
    </div>

    <div class="section">
      <h2>📝 Хэлмээр байгаа зүйлс</h2>
      <div id="notesBox" class="romantic-note" style="background:white; padding:15px; border-radius:15px; margin-bottom:10px;">Товчлууран дээр дарна уу 💖</div>
      <button class="pill" onclick="randomNote()">Нэгээр нь унших 🌷</button>
    </div>

    <div class="section">
      <h2>🧳 Хаашаа явмаар байна?</h2>
      <div class="travelGrid" id="travelGrid"></div>
      <p id="travelChoice" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
    </div>

    <div class="section" style="text-align:center;">
      <h2>🌸 Next chapter?</h2>
      <p class="romantic-note">Хэрвээ чи хүсвэл… шинэ дурсамж бүтээж болох юм ☕✨</p>
      <div style="display:flex; justify-content:center; gap:20px; height:80px; align-items:center;">
        <button class="pill" onclick="sayYes()">If you say yes… 😳</button>
        <button class="pill" style="background:#111" id="no-btn-chapter">If you say no… 🙈</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    // PRESERVING ALL YOUR ORIGINAL DATA
    const EVENTS = [
      { month: "September", img: "sep.png", title: "Анхны сэтгэгдэл 🌱", text: "Анхны сэтгэгдэл бол аягүй хөөрхөншд. Хийж байгаа үйлдэл, ярьж байгаа зүйл. Ялангуяа тэр гаргаж буй reaction нь бүр л..." },
      { month: "October", img: "oct.png", title: "Crown Амараа ✨", text: "Crown Амараагийн ард суух бол зүгээр л айдас хүйдэс хаха. Харин хувийн жолооч хийх нь миний хувьд нэр төрийн хэрэг байсан шүү." },
      { month: "November", img: "nov.jpg", title: "Үл ойлголцлууд 😄", text: "Мэдээж хүн болгонд л үл ойлголцол байдаг. Гэвч чамтай үүссэн нь арай өөр байсан." },
      { month: "December", img: "dec.png", title: "Гадаа хүйтэн ❄️", text: "Гадаа хүйтэн ч, сэтгэлд дулаахан өдрүүд байсан шүү." },
      { month: "January", img: "jan.png", title: "Хагацаж чадахгүй нь... 💭", text: "Бүх зүйл аягүй хөөрхөн болж байхад яваад өгчихөж байгаа юм даа." },
      { month: "Now", img: "now.jpg", title: "Өнөөдөр 💘", text: "Завгүй өдөр хоногууд ард ардаасаа хөвөрсөөр. Хурдан буцах юмсан..." }
    ];

    const COURAGE_NOTES = [
      "Яг үнэндээ хэний юу гэж хэлэх хэнд хамаатай юм бэ? Зүгээр л өөрийнхөөрөө байхад л ийм хөөрхөн.",
      "Хичээлийн хувьд битгий санаа зовоорой. Хэрэв тусламж хэрэгтэй бол би байна шүүдээ.",
      "Нэг зөвлөгөө өгөхөд: Хөөрхнөө гэж дуудуулж сурахдаа дасах хэрэгтэй шүү хаха.",
      "Мэдээж хэцүү цаг үеүүд болж өнгөрлөө, чамайг ямар мундаг гэдгийг харуулж байна.",
      "Харц чинь хамгийн хайр татам гэдгийг мэдэх үү?",
      "Чи зүгээр л хамгийн best нь."
    ];

    const TRAVELS = [
      { city: "Seoul", img: "seoul.jpg" }, { city: "Beijing", img: "beijing.jpg" }, { city: "Bangkok", img: "bangkok.jpg" }
    ];

    // JUMPING BUTTON LOGIC
    const noBtn = document.getElementById('no-btn-chapter');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    function sayYes() {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      alert("Яагаад ч юм энийг сонгохгүй байх гэж бодож байлаа😭💖 Хэзээ завтай вэ?");
    }

    // ORIGINAL RENDERING LOGIC
    function randomNote() {
      document.getElementById('notesBox').textContent = COURAGE_NOTES[Math.floor(Math.random()*COURAGE_NOTES.length)];
    }

    const timelineContainer = document.getElementById('timeline-container');
    EVENTS.forEach(e => {
      timelineContainer.innerHTML += `<div class="event reveal"><img src="${e.img}"><div><b>${e.month}</b><p>${e.text}</p></div></div>`;
    });

    const travelGrid = document.getElementById('travelGrid');
    TRAVELS.forEach(t => {
      travelGrid.innerHTML += `<div class="travelCard" onclick="document.getElementById('travelChoice').textContent='Chosen: ${t.city} ✨'"><img src="${t.img}"><p>${t.city}</p></div>`;
    });

    // REVEAL LOGIC
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('show'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // MUSIC LOGIC
    const music = document.getElementById('bgm');
    function toggleMusic() {
      if(music.paused) { music.play(); document.getElementById('playBtn').textContent="Pause ⏸"; }
      else { music.pause(); document.getElementById('playBtn').textContent="Play ▶"; }
    }
  </script>
</body>
</html>
