<!doctype html>
<html lang="mn">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Amarjargal 💘</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Dancing+Script:wght@700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1:#ff9a9e; --bg2:#fad0c4; --card:#ffffffdd; --text:#222;
      --muted:#555; --accent:#ff4d6d; --accent2:#7c3aed;
      --shadow: 0 18px 45px rgba(0,0,0,.18); --radius:26px;
    }

    * { box-sizing:border-box; transition: all 0.3s ease; }
    html,body { height:100%; scroll-behavior: smooth; }
    body {
      margin:0; font-family:'Noto Sans', sans-serif; color:var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height:100vh; overflow-x:hidden;
    }

    h1, h2 { font-family: 'Montserrat', sans-serif; }
    .romantic { font-family: 'Dancing Script', cursive; color: var(--accent); font-size: 1.5rem; }

    .progress {
      position:fixed; left:0; top:0; height:5px; width:0%;
      background: var(--accent); z-index:999;
    }

    .wrap { max-width:1040px; margin:0 auto; padding:26px 18px 90px; }
    .hero {
      background:var(--card); backdrop-filter: blur(10px);
      border-radius:var(--radius); padding:30px; text-align: center;
      box-shadow: var(--shadow);
    }

    .avatar { width:100px; height:100px; border-radius:50%; border:4px solid #fff; object-fit:cover; }

    .section {
      margin-top:25px; background:var(--card); border-radius:var(--radius);
      padding:25px; box-shadow: 0 14px 34px rgba(0,0,0,.12);
    }

    .pill {
      border:none; padding:12px 20px; border-radius:999px;
      background:var(--accent); color:#fff; font-weight:700; cursor:pointer;
    }
    .pill:hover { transform: translateY(-3px) scale(1.05); }
    .pill.secondary { background:#111; }
    .pill.soft { background:var(--accent2); }

    .note-box { margin-top:15px; padding:15px; background:#fff; border-radius:18px; border:1px solid rgba(0,0,0,0.05); min-height: 50px; }

    .travel-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:15px; margin-top:15px; }
    .travel-card { background:#fff; padding:15px; border-radius:20px; text-align:center; }
    .travel-card img { width:100%; height:150px; object-fit:cover; border-radius:15px; }

    #noBtn { position: relative; transition: none; } /* No transition for faster jumping */

    .reveal { opacity:0; transform: translateY(20px); }
    .reveal.show { opacity:1; transform: translateY(0); }
  </style>
</head>

<body>
  <div class="progress" id="progress"></div>
  
  <div class="wrap">
    <div class="hero reveal">
      <h1>Зөвхөн Амараад зориулав 💘</h1>
      <p class="romantic">Энэ website-ыг зөвхөн чамд...</p>
      
      <div style="display:flex; justify-content:center; gap:15px; margin:20px 0;">
        <img class="avatar" src="me.jpg">
        <div style="font-size:30px; align-self:center;">💞</div>
        <img class="avatar" src="amar.jpg">
      </div>

      <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
        <button class="pill" onclick="document.getElementById('timelineSection').scrollIntoView()">Аялцгаая ✨</button>
        <button class="pill secondary" onclick="alert('Жоомоор битгий айлгаарай! 😭🪳')">Жоом 🪳</button>
      </div>
    </div>

    <div class="section reveal">
      <h2>📝 Хэлмээр байгаа зүйлс</h2>
      <p>Үгс болгонд сэтгэл шингэсэн учир гамтай уншаарай 💜</p>
      <div style="display:flex; gap:10px;">
        <button class="pill" onclick="showRandomNote()">Нэгээр нь унших 🌷</button>
        <button class="pill soft" onclick="showAllNotes()">Бүгдийг нь унших 📚</button>
      </div>
      <div id="notesBox" class="note-box">Товчлууран дээр дарна уу 💖</div>
    </div>

    <div class="section reveal" id="timelineSection">
      <h2>📖 Бидний түүх</h2>
      <div id="timeline"></div>
    </div>

    <div class="section reveal">
      <h2>🧳 Хаашаа явмаар байна?</h2>
      <div class="travel-grid" id="travelGrid"></div>
      <div id="travelChoice" class="note-box" style="text-align:center; font-weight:bold;">Pick a city 💖</div>
    </div>

    <div class="section reveal" style="text-align:center;">
      <h2>🌸 Next chapter?</h2>
      <p class="romantic">Хэрвээ чи хүсвэл… шинэ дурсамж бүтээж болох юм ☕✨</p>
      <div style="display: flex; justify-content: center; gap: 20px; height: 100px; align-items: center;">
        <button class="pill" id="yesBtn" onclick="celebrate()">If you say yes… 😳</button>
        <button class="pill secondary" id="noBtn">If you say no… 🙈</button>
      </div>
      <div id="nextBox" style="margin-top:20px; font-weight:bold; color:var(--accent2)"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    const COURAGE_NOTES = [
      "Яг үнэндээ хэний юу гэж хэлэх хэнд хамаатай юм бэ? Зүгээр л өөрийнхөөрөө байхад л ийм хөөрхөн.",
      "Хичээлийн хувьд битгий санаа зовоорой. Хэрэв тусламж хэрэгтэй бол би байна шүүдээ.",
      "Нэг зөвлөгөө өгөхөд: Хөөрхнөө гэж дуудуулж сурахдаа дасах хэрэгтэй шүү хаха.",
      "Мэдээж хэцүү цаг үеүүд болж өнгөрлөө, энэ бүхнийг давж гарсан нь чамайг ямар мундаг гэдгийг харуулж байна.",
      "Харц чинь хамгийн хайр татам гэдгийг мэдэх үү? Сормуусаа дааж ядах нүд чинь намайг хичээхэд хүргэдэг.",
      "Ямар хүмүүжилтэй охин бэ гэж бодож билээ. Чи зүгээр л хамгийн best нь."
    ];

    const EVENTS = [
      { month: "September", img: "sep.png", title: "Анхны сэтгэгдэл 🌱", text: "Анхны сэтгэгдэл бол аягүй хөөрхөншд. Reaction нь бүр л..." },
      { month: "October", img: "oct.png", title: "Crown Амараа ✨", text: "Хувийн жолооч хийх нь миний хувьд нэр төрийн хэрэг байсан шүү." },
      { month: "November", img: "nov.jpg", title: "Үл ойлголцлууд 😄", text: "Яагаад ч юм чамайг харамлах өөрийгөө зогсоож чадаагүй." },
      { month: "December", img: "dec.png", title: "Гадаа хүйтэн ❄️", text: "Гадаа хүйтэн ч, сэтгэлд дулаахан өдрүүд байсан шүү." }
    ];

    const TRAVELS = [
      { city: "Seoul", img: "seoul.jpg", country: "Korea" },
      { city: "Tokyo", img: "shanghai.jpg", country: "Japan" },
      { city: "Bangkok", img: "bangkok.jpg", country: "Thailand" }
    ];

    function showRandomNote() {
      const note = COURAGE_NOTES[Math.floor(Math.random() * COURAGE_NOTES.length)];
      document.getElementById('notesBox').innerHTML = `<p class="romantic" style="font-size:1.1rem">" ${note} "</p>`;
    }

    function showAllNotes() {
      document.getElementById('notesBox').innerHTML = COURAGE_NOTES.map(n => `<p>• ${n}</p>`).join('');
    }

    // Timeline logic
    const timeline = document.getElementById('timeline');
    EVENTS.forEach(e => {
      timeline.innerHTML += `
        <div class="event reveal" style="display:flex; gap:15px; margin-bottom:15px; background:white; padding:15px; border-radius:20px;">
          <img src="${e.img}" style="width:100px; height:100px; object-fit:cover; border-radius:15px;">
          <div><b>${e.month}</b><p>${e.text}</p></div>
        </div>`;
    });

    // Travel logic
    const grid = document.getElementById('travelGrid');
    TRAVELS.forEach(t => {
      grid.innerHTML += `
        <div class="travel-card" onclick="document.getElementById('travelChoice').textContent='Chosen: ${t.city} ✈️'">
          <img src="${t.img}">
          <p><b>${t.city}</b> (${t.country})</p>
        </div>`;
    });

    // Escaping Button Logic
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    function celebrate() {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      document.getElementById('nextBox').textContent = "Яагаад ч юм энийг сонгохгүй байх гэж бодож байлаа😭💖 Хэзээ завтай вэ?";
    }

    // Scroll Reveal
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('show'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  </script>
</body>
</html>
