<!doctype html>
<html lang="mn">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Amarjargal 💘</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Dancing+Script:wght@700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --card:#ffffffdd;
      --text:#222;
      --muted:#555;
      --accent:#ff4d6d;
      --accent2:#7c3aed;
      --shadow: 0 18px 45px rgba(0,0,0,.18);
      --radius:26px;
    }

    /* Recommendation: Smooth Global Transitions */
    * { 
      box-sizing:border-box; 
      transition: all 0.3s ease-out; 
    }

    html,body { height:100%; scroll-behavior: smooth; }

    body {
      margin:0;
      font-family:'Noto Sans', sans-serif;
      color:var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height:100vh;
      overflow-x:hidden;
    }

    h1, h2 { font-family: 'Montserrat', sans-serif; font-weight: 800; }
    .romantic-font { font-family: 'Dancing Script', cursive; color: var(--accent); font-size: 1.5rem; }

    .progress {
      position:fixed; left:0; top:0; height:5px; width:0%;
      background: var(--accent);
      z-index:999;
      box-shadow:0 6px 16px rgba(0,0,0,.18);
    }

    .wrap { max-width:1040px; margin:0 auto; padding:26px 18px 90px; }

    .hero {
      background:var(--card);
      backdrop-filter: blur(10px);
      border:1px solid #fff;
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      padding:30px;
      text-align: center;
    }

    .avatars { display:flex; gap:12px; align-items:center; justify-content: center; margin: 20px 0; }
    
    .avatar {
      width:100px; height:100px;
      border-radius:999px;
      border:4px solid #fff;
      box-shadow:0 12px 28px rgba(0,0,0,0.15);
      object-fit:cover;
    }

    .section {
      margin-top:25px;
      background:var(--card);
      border-radius:var(--radius);
      padding:25px;
      box-shadow: 0 14px 34px rgba(0,0,0,.12);
    }

    .pill {
      border:none;
      padding:12px 20px;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .pill:hover { transform: translateY(-3px) scale(1.05); }
    .pill.secondary { background:#111; }
    .pill.soft { background:var(--accent2); }

    /* Moving Button Logic Container */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      height: 120px;
      align-items: center;
      position: relative;
    }

    #noBtn { position: relative; }

    /* Responsive Images fix */
    img { max-width: 100%; height: auto; border-radius: 18px; }

    .timeline { display:grid; gap:15px; }
    .event {
      display:flex; gap:14px; padding:15px; border-radius:22px;
      background:#fff; align-items:center; flex-wrap:wrap;
    }

    /* Scroll reveal */
    .reveal { opacity:0; transform: translateY(20px); }
    .reveal.show { opacity:1; transform: translateY(0); }
  </style>
</head>

<body>
  <div class="progress" id="progress"></div>
  
  <div class="wrap">
    <div class="hero reveal">
      <h1>Зөвхөн Амараад зориулав 💘</h1>
      <p class="romantic-font">Энэ website-ыг зөвхөн чамд...</p>
      <p style="color:var(--muted)">Ойрд яагаад чат бичихгүй байна аа гэж бодсон уу? Код бичээд завгүй байлаа шүү дээ✨</p>

      <div class="avatars">
        <img class="avatar" src="me.jpg" alt="Me">
        <div style="font-size:30px;">💞</div>
        <img class="avatar" src="amar.jpg" alt="Amaraa">
      </div>

      <div class="pillRow" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
        <button class="pill" onclick="document.getElementById('timelineSection').scrollIntoView()">Цаг хугацаагаар аялцгаая ✨</button>
        <button class="pill secondary" onclick="cockroachStory()">Жоом 🪳😂</button>
      </div>
      <div id="heroNote" style="display:none; margin-top:15px; padding:10px; background:#fff; border-radius:15px;"></div>
    </div>

    <div class="section reveal">
      <h2>🎵 Зөвхөн чамд зориулсан дуу</h2>
      <div class="pillRow">
        <button class="pill" onclick="toggleMusic()" id="playBtn">Play ▶</button>
        <input type="range" id="seek" style="flex:1; accent-color:var(--accent)" value="0">
      </div>
      <audio id="bgm" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <div class="section reveal" id="timelineSection">
      <h2>📖 Эргэн дурсацгаая</h2>
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="section reveal" style="text-align:center;">
      <h2>🌸 Next chapter?</h2>
      <p class="romantic-font">Хэрвээ чи хүсвэл… шинэ дурсамж бүтээж болох юм ☕✨</p>
      
      <div class="button-container">
        <button class="pill" id="yesBtn" onclick="celebrate()">If you say yes… 😳</button>
        <button class="pill secondary" id="noBtn">If you say no… 🙈</button>
      </div>
      <div id="nextBox" style="margin-top:20px; font-weight:bold; color:var(--accent2)"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    // DATA - All your Mongolian text is safe here
    const EVENTS = [
      { month: "September", img: "sep.png", title: "Анхны сэтгэгдэл 🌱", text: "Анхны сэтгэгдэл бол аягүй хөөрхөншд. Хийж байгаа үйлдэл, ярьж байгаа зүйл. Ялангуяа тэр гаргаж буй reaction нь бүр л..." },
      { month: "October", img: "oct.png", title: "Crown Амараа ✨", text: "Crown Амараагийн ард суух бол зүгээр л айдас хүйдэс хаха. Харин хувийн жолооч хийх нь миний хувьд нэр төрийн хэрэг байсан шүү. Өдөр болгон чамайг хүргэж өгөх зорилготой сэрэх жишээний хаха." },
      { month: "November", img: "nov.jpg", title: "Үл ойлголцлууд 😄", text: "Мэдээж хүн болгонд л үл ойлголцол байдаг. Гэвч чамтай үүссэн нь арай өөр байсан. Яагаад ч юм минийх биш чамайг харамлах өөрийгөө зогсоож чадаагүй." },
      { month: "December", img: "dec.png", title: "Гадаа хүйтэн ч сэтгэлд дулаахан ❄️", text: "Гадаа цас ороод л, нөгөө цас нь яасан ч сайхан хэлбэрт ордог юм. Гадаа хүйтэн ч, сэтгэлд дулаахан өдрүүд байсан шүү." },
      { month: "January", img: "jan.png", title: "Хагацаж чадахгүй нь л гэж бодсон 💭", text: "Бүх зүйл аягүй хөөрхөн болж байхад яваад өгчихөж байгаа юм даа. Гэхдээ яахав, дахиад уулзахаа мэдэж байсан." },
      { month: "Now", img: "now.jpg", title: "Өнөөдөр 💘", text: "Завгүй өдөр хоногууд ард ардаасаа хөвөрсөөр. Хурдан буцах юмсан гэх бодлыг минь чиний story-нууд boost-лэх шиг 😳" }
    ];

    // 1. Escaping No Button Logic
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    // 2. Confetti Yes Logic
    function celebrate() {
      confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff4d6d', '#7c3aed', '#fad0c4']
      });
      document.getElementById('nextBox').textContent = "Яагаад ч юм энийг сонгохгүй байх гэж бодож байлаа😭💖 Хэзээ завтай вэ? Юу ч хийхгүй алхах уу?✨";
    }

    // Timeline Rendering
    const timelineEl = document.getElementById('timeline');
    EVENTS.forEach(e => {
      const card = document.createElement('div');
      card.className = 'event reveal';
      card.innerHTML = `
        <img src="${e.img}" alt="${e.title}">
        <div class="meta">
          <b>${e.month} — ${e.title}</b>
          <p>${e.text}</p>
        </div>
      `;
      timelineEl.appendChild(card);
    });

    // Intersection Observer for Reveal
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('show'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    // Scroll Progress
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById("progress").style.width = scrolled + "%";
    });

    // Basic Music Toggle
    const music = document.getElementById('bgm');
    function toggleMusic() {
      if (music.paused) { music.play(); document.getElementById('playBtn').textContent = "Pause ⏸"; }
      else { music.pause(); document.getElementById('playBtn').textContent = "Play ▶"; }
    }

    function cockroachStory() {
      const heroNote = document.getElementById('heroNote');
      heroNote.style.display = 'block';
      heroNote.innerHTML = "Энэ бол маш чухал 🪳😂: Хүн битгтиййййййййй гээд байхад яагаад юм болдоо 😭";
    }
  </script>
</body>
</html>
